name: Android

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compilar-y-probar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar el JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Preparar Gradle (con caché de dependencias)
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permiso de ejecución al wrapper
        run: chmod +x gradlew

      # El release sale sin firmar: la clave no está en el CI (decisión 28). Compilarlo igual avisa
      # si algo que solo usa el release, como su configuración de red, deja de compilar.
      - name: Compilar la app (debug y release) y correr los tests unitarios
        run: ./gradlew assembleDebug assembleRelease testDebugUnitTest --no-daemon --stacktrace
